services:
  - type: web
    name: messmess-staging-api
    runtime: node
    plan: free
    region: oregon
    autoDeploy: false
    buildCommand: npm ci && npm run db:generate --workspace=@messmess/api && npm run build --workspace=@messmess/api
    startCommand: npm run start --workspace=@messmess/api
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: lax
      - key: RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: RATE_LIMIT_MAX_REQUESTS
        value: '100'
